name: EcoSure ingest

# Polls Gmail for CMX report emails and ingests them:
#   Food Safety / EcoSure  -> ecosure_assessments
#   Ops Assessment         -> fbc_assessment_store_department_score
#   Ops Self-Assessment    -> survey_store_department_score
#
# THIS FILE WAS LOST ON 2026-10-06 when the cmx repo's workflow was uploaded
# here by mistake, overwriting it. Nothing ingested for twenty days and no
# alarm fired, because a workflow that does not exist cannot fail. If you are
# about to replace this file, check the name at the top is still
# "EcoSure ingest" before you commit.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 02:00 PDT
  workflow_dispatch: {}

# Prevent two runs overlapping: both would claim the same unlabelled messages.
concurrency:
  group: ecosure-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # service-account JSON is stored as a secret; write it to a file
      - name: Write Google credentials
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > /tmp/gcreds.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Run poller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcreds.json
        run: python gmail_poller.py
